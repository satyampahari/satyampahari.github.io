<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Satyam Pahari's personal GitHub Pages site with an octopus chase game.">
    <title>Satyam Pahari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-labelledby="game-title">
        <div class="game-head">
          <div>
            <p class="eyebrow">satyampahari.github.io</p>
            <h2 id="game-title">Octopus Hunt</h2>
          </div>
          <div class="scores" aria-live="polite">
            <span>Score <strong id="score">0</strong></span>
            <span>Best <strong id="best">0</strong></span>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="1280" height="720" aria-label="Octopus chasing Caesar game"></canvas>
          <button id="startButton" class="start-button" type="button">Start</button>
        </div>

        <div class="controls">
          <button id="moveButton" type="button">Move</button>
          <button id="boostButton" type="button">Boost</button>
          <button id="restartButton" type="button">Restart</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
